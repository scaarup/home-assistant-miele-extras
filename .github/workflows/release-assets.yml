name: Release assets

# Runs when a release is published. Stamps the release version (from the tag) into manifest.json
# inside the zip and uploads it, so the version Home Assistant shows always matches the release.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    name: Build and upload zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Stamp version and build zip
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not semantic (vX.Y.Z)." >&2
            exit 1
          fi
          manifest=custom_components/miele_extras/manifest.json
          jq --arg v "$version" '.version = $v' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"
          cd custom_components/miele_extras
          zip -r "$GITHUB_WORKSPACE/miele_extras.zip" . -x "__pycache__/*" "*.pyc"

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" miele_extras.zip --clobber
