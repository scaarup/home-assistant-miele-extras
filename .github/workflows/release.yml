name: Release

# A release is created automatically when the version in the manifest changes on main.
# To release: open a pull request that bumps "version" in
# custom_components/miele_extras/manifest.json, let the checks pass, and merge it.

on:
  push:
    branches: [main]
    paths:
      - custom_components/miele_extras/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          version=$(jq -r .version custom_components/miele_extras/manifest.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Manifest version '$version' is not semantic (X.Y.Z)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if the release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.exists.outputs.exists == 'false'
        run: |
          cd custom_components/miele_extras
          zip -r "$GITHUB_WORKSPACE/miele_extras.zip" . -x "__pycache__/*" "*.pyc"

      - name: Create release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then flags="--prerelease"; fi
          gh release create "${{ steps.version.outputs.tag }}" miele_extras.zip \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes $flags
