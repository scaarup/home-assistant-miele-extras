name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
no-changes-template: "- No notable changes."
exclude-labels:
  - ignore-for-release
categories:
  - title: New features
    labels: [enhancement, feature]
  - title: Fixes
    labels: [bug, fix]
  - title: Maintenance
    labels: [maintenance, dependencies, ci]
  - title: Documentation
    labels: [documentation]
version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [enhancement, feature]
  patch:
    labels: [bug, fix, maintenance, dependencies, ci, documentation]
  default: patch
template: |
  ## What's changed

  $CHANGES
